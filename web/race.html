<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match · OxMarket</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap" id="race-root">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Matches</a><span aria-hidden="true">›</span><span id="crumb-comp">…</span></nav>
  <section class="page-head">
    <span class="rc-icon lg" id="race-icon" aria-hidden="true">🏆</span>
    <div class="titles">
      <h1 id="race-title">Loading…</h1>
      <div class="meta" id="race-meta"></div>
    </div>
    <div class="closes-box" id="closes-box"></div>
  </section>

  <div class="layout" style="margin-top:20px">
    <div class="col-main">
      <div class="banner" id="result-banner" hidden></div>
      <section class="card card-pad">
        <div class="card-head">
          <h2>Odds over time</h2>
          <div class="seg" id="bucket" role="group" aria-label="Chart resolution">
            <button type="button" data-bucket="1m" aria-pressed="false">1m</button>
            <button type="button" data-bucket="5m" aria-pressed="true">5m</button>
            <button type="button" data-bucket="1h" aria-pressed="false">1h</button>
          </div>
        </div>
        <div class="chart-box"><canvas id="race-chart" aria-label="Chance of each outcome over time" role="img"></canvas></div>
        <p class="empty" id="chart-empty" hidden>No trading history yet.</p>
      </section>
      <section class="card card-pad">
        <h2 style="margin-bottom:8px">Outcomes</h2>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Outcome</th><th class="right">Chance</th><th>24h</th><th class="right">Volume (24h)</th><th class="right"><span class="sr-only">Trade</span></th></tr></thead>
            <tbody id="cand-body"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
          </table>
        </div>
        <p class="tiny faint" id="overround" style="margin:10px 0 0"></p>
      </section>
    </div>
    <aside class="col-side">
      <section class="card card-pad brief">
        <div class="card-head" style="margin-bottom:8px">
          <h2>Why did the odds move?</h2>
          <span class="ai-label">✦ Generated by Gemini</span>
        </div>
        <div id="brief-text" aria-live="polite"><p class="muted">Loading…</p></div>
        <button class="btn btn-ghost btn-sm" id="brief-refresh" type="button">Refresh analysis</button>
        <div id="brief-msg"></div>
      </section>
      <section class="card card-pad">
        <h2 style="margin-bottom:10px">Rules</h2>
        <dl class="kv" id="rules"></dl>
        <p class="small muted" id="criteria" style="margin-top:12px"></p>
      </section>
    </aside>
  </div>
</main>
<footer class="site-foot"><div class="wrap">OxMarket is a play-money prediction market on Oxford college Cuppers. No real money is involved.</div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/race.js"></script>
</body>
</html>
